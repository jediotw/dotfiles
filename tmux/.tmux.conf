##### ==========================
##### Prefix
##### ==========================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### ==========================
##### General
##### ==========================

bind c new-window -c "$HOME"
# Enable mouse support
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"


# ============================================================
# iSheild — automatic tmux theme
# ============================================================

if-shell '[ -x "$HOME/iSheild/terminal/switch-tmux.sh" ]' \
    'run-shell -b "$HOME/iSheild/terminal/switch-tmux.sh"'

##### ==========================
##### Windows & Panes
##### ==========================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'
setw -g mode-keys vi

##### ==========================
##### Splits
##### ==========================

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### ==========================
##### Pane Navigation
##### ==========================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### ==========================
##### Resize Panes
##### ==========================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### ==========================
##### Reload Config
##### ==========================

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### ==========================
##### Clipboard
##### ==========================

set -g set-clipboard on

##### ==========================
##### Status Bar
##### ==========================

#set -g status-position bottom
#set -g status-interval 5
##### ==========================
##### Status Bar
##### ==========================

set -g status-position bottom
set -g status-interval 5

# Far Manager-inspired status bar
set -g status-style "bg=#000080,fg=#C0C0C0"

# Left: session name
set -g status-left "#[fg=#00FFFF,bold][#S] "

# Right: intentionally empty
set -g status-right ""

# Window indicators
set -g window-status-format "#[fg=#C0C0C0] #I:#W "
set -g window-status-current-format "#[fg=#000080,bg=#00FFFF,bold] #I:#W "
set -g window-status-separator ""
##### ==========================
##### TPM
##### ==========================

set -g @plugin 'tmux-plugins/tpm'

##### ==========================
##### Plugins
##### ==========================

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'

##### ==========================
##### Continuum
##### ==========================

set -g @continuum-restore 'on'

##### ==========================
##### tmux-fzf
##### ==========================

bind f run-shell "~/.tmux/plugins/tmux-fzf/scripts/window.sh"
bind s run-shell "~/.tmux/plugins/tmux-fzf/scripts/session.sh"
bind p run-shell "~/.tmux/plugins/tmux-fzf/scripts/pane.sh"

##### ==========================
##### Initialize TPM
##### ==========================

run '~/.tmux/plugins/tpm/tpm'
